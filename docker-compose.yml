services:
  pgvector_db:
    image: ankane/pgvector:v0.5.1
    container_name: taskmind_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: taskmind_api
    depends_on:
      pgvector_db:
        condition: service_healthy
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://user:password@pgvector_db:5432/tasks
      OLLAMA_URL: http://host.docker.internal:11434
      TASKMIND_ENABLE_OLLAMA: "false"
      PORT: 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: taskmind_web
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      TASKMIND_API_URL: http://api:8000
      PORT: 8501

volumes:
  pgdata:
